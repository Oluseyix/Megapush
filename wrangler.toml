# MegaPush — Workers + Static Assets
name = "megapush"
main = "cf-worker/index.js"
compatibility_date = "2025-03-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true
preview_urls = true

[assets]
directory = "./public"
binding = "ASSETS"
# Worker runs first so /api/* works and game HTML can inject edge-cached prize pool
run_worker_first = true

[[kv_namespaces]]
binding = "BANK_KV"
id = "98039eb0b6574e8e98fe154b69e4b9a4"

[[durable_objects.bindings]]
name = "ROUND_DO"
class_name = "RoundDO"

[[durable_objects.bindings]]
name = "TX_SEQUENCER_DO"
class_name = "TxSequencerDO"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RoundDO", "TxSequencerDO"]

[vars]
MAX_ROUND_EXPOSURE = "500"
MAX_PAYOUT_MULT = "50"
MAX_PAYOUT_PER_ENTRY = "200"
MAX_PAYOUT_PER_HOUR = "2000"
MAX_HOUSE_JOBS_PER_MINUTE = "40"
# Reverse hash-chain length (seeds). Exhausted chain refuses new rounds (no silent re-seed).
SEED_CHAIN_LENGTH = "10000"
