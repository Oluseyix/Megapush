# Cloudflare Pages — MegaPush
# Dashboard: Workers & Pages → Create → Connect Git → this repo
# Build output directory: public
# Root directory: (repo root)
#
# Secrets (Settings → Environment variables / Secrets):
#   HOUSE_PRIVATE_KEY  (required)
#   ROUND_SECRET       (optional)
#   RPC_URL            (optional, default Base Sepolia public RPC)
#
# MEGAPUSH_KV backs the play-bank balances and the leaderboard with
# durable, globally consistent storage. Without it, both features still
# work but fall back to the Worker Cache API (best-effort, scoped per
# edge location) and the leaderboard stays empty.

name = "megapush"
compatibility_date = "2025-03-01"
compatibility_flags = ["nodejs_compat"]
pages_build_output_dir = "public"

[[kv_namespaces]]
binding = "MEGAPUSH_KV"
id = "98039eb0b6574e8e98fe154b69e4b9a4"
