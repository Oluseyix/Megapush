# Optional Pages Advanced fallback (NO Durable Objects).
# Use only if Workers deploy is blocked:
#   npm run build && npx wrangler pages deploy public --project-name megapush --commit-dirty=true
#
# Prefer wrangler.toml (Workers + Static Assets + DOs).

name = "megapush"
compatibility_date = "2025-03-01"
compatibility_flags = ["nodejs_compat"]
pages_build_output_dir = "public"

[[kv_namespaces]]
binding = "BANK_KV"
id = "98039eb0b6574e8e98fe154b69e4b9a4"
